<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | niji-goods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .filter-bar { margin-top: 100px; padding: 40px 0; border-bottom: 1px solid #f0f0f0; }
    .filter-tags { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
    .filter-tag { font-size: 13px; color: #999; cursor: pointer; transition: color 0.3s; position: relative; }
    .filter-tag:hover, .filter-tag.active { color: #1a1a1a; }
    .filter-tag.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 1px; background: #1a1a1a; }
    
    .pagination { margin: 60px 0; display: flex; justify-content: center; gap: 20px; }
    .page-btn { padding: 8px 16px; border: 1px solid #eee; background: #fff; cursor: pointer; font-size: 13px; }
    .page-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  </style>
</head>
<body>

  <nav class="navbar-life">
    <a href="index.html" class="logo-life">niji-goods</a>
    <div class="nav-links-life">
      <a href="products.html?div=socks" data-tc="SOCKS" data-jp="SOCKS">SOCKS</a>
      <a href="products.html?div=bedding" data-tc="BEDDING" data-jp="BEDDING">BEDDING</a>
      <a href="products.html?div=inner" data-tc="INNER" data-jp="INNER">INNER</a>
      <a href="about.html" data-tc="CONCEPT" data-jp="CONCEPT">CONCEPT</a>
      <div class="lang-switcher">
        <span onclick="setLang('tc')" class="lang-btn" data-lang="tc">TC</span> / <span onclick="setLang('jp')" class="lang-btn" data-lang="jp">JP</span>
      </div>
    </div>
  </nav>

  <section class="filter-bar">
    <div class="container">
      <div class="filter-tags" id="filterTags">
        <!-- Dynamic Tags -->
      </div>
    </div>
  </section>

  <section class="portal-section" style="background:#fff; min-height: 80vh;">
    <div class="container">
      <div id="productGrid" class="division-grid" style="grid-template-columns: repeat(4, 1fr); gap: 40px 20px;">
        <!-- Filled by JS -->
      </div>
      
      <div id="pagination" class="pagination"></div>
    </div>
  </section>

  <footer>
    <div class="logo-life" style="margin-bottom: 30px;">niji-goods</div>
    <p style="font-size: 0.7rem; color: #ccc;">&copy; 2026 niji-goods. All rights reserved.</p>
  </footer>

  <script src="store.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let activeFilter = urlParams.get('cat') || 'all';
    let activeDiv = urlParams.get('div') || 'all';
    let currentPage = 1;
    const itemsPerPage = 16;

    function applyFilter() {
      renderTags();
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      
      let filtered = PRODUCTS;
      
      if (activeDiv !== 'all') {
        filtered = filtered.filter(p => p.division === activeDiv);
      }
      
      if (activeFilter !== 'all') {
        filtered = filtered.filter(p => p.material === activeFilter);
      }
      
      const totalPages = Math.ceil(filtered.length / itemsPerPage);
      const start = (currentPage - 1) * itemsPerPage;
      const paginated = filtered.slice(start, start + itemsPerPage);
      
      paginated.forEach(p => {
        grid.appendChild(createProductCard(p));
      });

      renderPagination(totalPages);
    }

    function renderTags() {
      const tagContainer = document.getElementById('filterTags');
      tagContainer.innerHTML = '';
      
      const tags = [
        { id: 'all', tc: '全部商品', jp: 'すべて', divs: ['all', 'socks', 'bedding', 'inner'] },
        { id: 'cotton', tc: '精梳棉', jp: 'コットン', divs: ['all', 'socks'] },
        { id: 'silk', tc: '蠶絲', jp: 'シルク', divs: ['all', 'socks'] },
        { id: 'glass', tc: '網紗', jp: 'シアー', divs: ['all', 'socks'] },
        { id: 'linen', tc: '亞麻', jp: 'リネン', divs: ['all', 'bedding'] },
        { id: 'modal', tc: '莫代爾', jp: 'モダール', divs: ['all', 'inner'] }
      ];

      tags.filter(t => t.divs.includes(activeDiv)).forEach(t => {
        const div = document.createElement('div');
        div.className = `filter-tag ${t.id === activeFilter ? 'active' : ''}`;
        div.textContent = currentLang === 'tc' ? t.tc : t.jp;
        div.onclick = () => {
          activeFilter = t.id;
          currentPage = 1;
          history.pushState(null, '', `?cat=${activeFilter}${activeDiv !== 'all' ? '&div='+activeDiv : ''}`);
          applyFilter();
        };
        tagContainer.appendChild(div);
      });
    }

    function renderPagination(total) {
      const container = document.getElementById('pagination');
      container.innerHTML = '';
      if (total <= 1) return;

      for (let i = 1; i <= total; i++) {
        const btn = document.createElement('button');
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.textContent = i;
        btn.onclick = () => {
          currentPage = i;
          window.scrollTo({ top: 300, behavior: 'smooth' });
          applyFilter();
        };
        container.appendChild(btn);
      }
    }



    document.addEventListener('DOMContentLoaded', () => {
      setLang(currentLang);
      applyFilter();
    });
  </script>
</body>
</html>
