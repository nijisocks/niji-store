<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail | niji-goods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260531">
  <style>
    .product-detail-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 80px; margin-top: 60px; }
    .product-gallery img { width: 100%; aspect-ratio: 4/5; object-fit: cover; background-color: var(--warm-white); transition: opacity 0.5s; }
    .product-info { text-align: left; }
    .prod-price { font-size: 24px; font-weight: 500; margin: 30px 0; color: var(--black); }
    .option-group { margin-bottom: 30px; }
    .option-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--light); margin-bottom: 15px; display: block; }
    .color-dots { display: flex; gap: 12px; }
    .color-dot { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer; position: relative; }
    .color-dot.active::after { content: ''; position: absolute; inset: -4px; border: 1px solid var(--black); border-radius: 50%; }
    .size-btns { display: flex; gap: 10px; }
    .size-btn { padding: 10px 25px; border: 1px solid var(--border); background: none; font-size: 13px; cursor: pointer; transition: 0.3s; }
    .size-btn.active { border-color: var(--black); background: var(--black); color: #fff; }
    .add-btn { width: 100%; padding: 18px; background: var(--black); color: #fff; border: none; font-size: 14px; letter-spacing: 0.1em; cursor: pointer; margin-top: 20px; transition: 0.3s; }
    .add-btn:hover { background: #333; }
    .prod-desc { margin-top: 50px; border-top: 1px solid var(--border); padding-top: 40px; font-size: 15px; color: var(--dark); line-height: 2.2; font-weight: 300; }
  </style>
</head>
<body>

  <nav class="navbar-life">
    <a href="index.html" class="logo-life">niji-goods</a>
    <div class="nav-links-life">
      <a href="products.html?div=socks" data-tc="SOCKS" data-jp="SOCKS">SOCKS</a>
      <a href="products.html?div=bedding" data-tc="BEDDING" data-jp="BEDDING">BEDDING</a>
      <a href="products.html?div=inner" data-tc="INNER" data-jp="INNER">INNER</a>
      <a href="about.html" data-tc="CONCEPT" data-jp="CONCEPT">CONCEPT</a>
      <div class="lang-switcher">
        <span onclick="setLang('tc')" class="lang-btn" data-lang="tc">TC</span> / <span onclick="setLang('jp')" class="lang-btn" data-lang="jp">JP</span>
      </div>
    </div>
  </nav>

  <div class="container" style="margin-top: 150px;">
    <div id="productDetail" class="product-detail-layout">
      <!-- Loaded by JS -->
    </div>
  </div>

  <section class="portal-section">
    <div class="container">
      <div class="section-label">You May Also Like</div>
      <div class="section-title" data-tc="相關推薦" data-jp="おすすめアイテム">おすすめアイテム</div>
      <div id="relatedGrid" class="division-grid">
        <!-- Related Items -->
      </div>
    </div>
  </section>

  <footer>
    <div class="logo-life" style="margin-bottom: 30px;">niji-goods</div>
    <p style="font-size: 0.7rem; color: #ccc;">&copy; 2026 niji-goods. All rights reserved.</p>
  </footer>

  <script src="store.js"></script>
  <script>
    let selectedSize = '';
    let selectedColor = '';

    document.addEventListener('DOMContentLoaded', () => {
      setLang(currentLang);
      renderProduct();
    });

    function renderProduct() {
      const id = parseInt(new URLSearchParams(window.location.search).get('id'));
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) { document.getElementById('productDetail').innerHTML = 'Product not found'; return; }

      if (!selectedSize) selectedSize = p.sizes[0];
      if (!selectedColor) selectedColor = p.colors[0];

      const name = currentLang === 'tc' ? p.nameTC : p.nameJP;
      const desc = currentLang === 'tc' ? p.descTC : p.descJP;
      const addBtnText = currentLang === 'tc' ? '加入購物車' : 'カートに入れる';

      const colorDots = p.colors.map(c => `<div class="color-dot ${c === selectedColor ? 'active' : ''}" style="background:${c};" onclick="selectedColor='${c}';renderProduct()"></div>`).join('');
      const sizeBtns = p.sizes.map(s => `<button class="size-btn ${s === selectedSize ? 'active' : ''}" onclick="selectedSize='${s}';renderProduct()">${s}</button>`).join('');

      const attrHtml = p.attribute ? `
        <div class="option-group" style="margin-top:20px;">
          <span class="option-label">${p.attribute.label}</span>
          <div style="font-size:14px; color:var(--dark);">${p.attribute.value}</div>
        </div>
      ` : '';

      document.getElementById('productDetail').innerHTML = `
        <div class="product-gallery">
          <img src="${p.img}" alt="${name}" id="mainImg">
        </div>
        <div class="product-info">
          <p class="section-label">${p.material.toUpperCase()} Collection</p>
          <h1 class="section-title" style="text-align:left; font-size:42px; margin-bottom:10px;">${name}</h1>
          <div class="prod-price">${formatPrice(p.price)} <span style="font-size:12px; color:#999; font-weight:400;">(税込)</span></div>
          
          <div class="option-group">
            <span class="option-label">Color</span>
            <div class="color-dots">${colorDots}</div>
          </div>

          <div class="option-group">
            <span class="option-label">Size</span>
            <div class="size-btns">${sizeBtns}</div>
          </div>

          ${attrHtml}

          <button class="add-btn" onclick="Cart.add(${p.id}, '${selectedSize}')">${addBtnText}</button>
          
          <div class="prod-desc">
            <span class="option-label">Description / 商品詳細</span>
            <p>${desc}</p>
          </div>
        </div>
      `;

      // Related (Division Aware)
      const relGrid = document.getElementById('relatedGrid');
      relGrid.innerHTML = '';
      PRODUCTS.filter(x => x.id !== p.id && x.division === p.division).slice(0, 4).forEach(x => relGrid.appendChild(createProductCard(x)));
    }
  </script>
</body>
</html>
