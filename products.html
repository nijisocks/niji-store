<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collections | niji-goods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .products-layout { display: grid; grid-template-columns: 200px 1fr; gap: 60px; margin-top: 60px; }
    .filter-sidebar { text-align: left; }
    .filter-group { margin-bottom: 40px; }
    .filter-group h3 { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--life-accent); margin-bottom: 20px; font-family: var(--font-serif); }
    .filter-item { margin-bottom: 12px; font-size: 13px; color: var(--mid); cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .filter-item input { accent-color: var(--life-accent); }
    .products-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    .products-count { font-size: 12px; color: var(--light); letter-spacing: 0.1em; }
    .sort-select { border: none; font-size: 12px; color: var(--mid); background: none; outline: none; cursor: pointer; }
  </style>
</head>
<body>

  <nav class="navbar-life">
    <a href="index.html" class="logo-life">niji-goods</a>
    <div class="nav-links-life">
      <a href="socks.html">Socks</a>
      <a href="about.html">Concept</a>
      <div class="lang-switcher">
        <span onclick="setLang('tc')" id="lang-tc">TC</span> / <span onclick="setLang('jp')" id="lang-jp">JP</span>
      </div>
    </div>
  </nav>

  <section class="portal-section" style="padding-bottom: 0;">
    <div class="container">
      <p style="font-size: 10px; letter-spacing: 0.2em; color: var(--light); margin-bottom: 20px; text-transform: uppercase;">
        <a href="index.html">Home</a> / <span id="breadcrumb-current">All Collections</span>
      </p>
      <h1 id="pageHeading" class="section-title" style="font-size: 42px;">所有系列</h1>
    </div>
  </section>

  <div class="container">
    <div class="products-layout">
      <aside class="filter-sidebar">
        <div class="filter-group">
          <h3>材質 / Material</h3>
          <div class="filter-item"><input type="checkbox" id="f-cotton" onchange="applyFilter()"><label for="f-cotton">精梳棉 / Cotton</label></div>
          <div class="filter-item"><input type="checkbox" id="f-silk" onchange="applyFilter()"><label for="f-silk">蠶絲 / Silk</label></div>
          <div class="filter-item"><input type="checkbox" id="f-glass" onchange="applyFilter()"><label for="f-glass">網紗 / Glass</label></div>
        </div>
        <div class="filter-group">
          <h3>系列 / Collection</h3>
          <div class="filter-item"><input type="checkbox" id="f-new" onchange="applyFilter()"><label for="f-new">新品 / New Arrivals</label></div>
          <div class="filter-item"><input type="checkbox" id="f-gift" onchange="applyFilter()"><label for="f-gift">禮盒 / Gift Set</label></div>
        </div>
      </aside>

      <main>
        <div class="products-top">
          <p class="products-count"><span id="productCount">0</span> Items found</p>
          <select class="sort-select" id="sortSelect" onchange="applyFilter()">
            <option value="default">推薦排序 / Featured</option>
            <option value="price-asc">價格：由低到高 / Price: Low to High</option>
            <option value="price-desc">價格：由高到低 / Price: High to Low</option>
          </select>
        </div>
        <div id="productGrid" class="division-grid" style="grid-template-columns: repeat(3, 1fr); margin-top: 0;">
          <!-- Filled by JS -->
        </div>
      </main>
    </div>
  </div>

  <footer>
    <div class="logo-life" style="margin-bottom: 30px;">niji-goods</div>
    <p style="font-size: 0.7rem; color: #ccc;">&copy; 2026 niji-goods. All rights reserved.</p>
  </footer>

  <script src="store.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setLang(currentLang);
      applyFilter();
    });

    function applyFilter() {
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('cat');
      
      let filtered = [...PRODUCTS];

      if (cat) {
        if (cat === 'cotton') filtered = filtered.filter(p => p.material === 'cotton');
        else if (cat === 'silk') filtered = filtered.filter(p => p.material === 'silk');
        else if (cat === 'glass') filtered = filtered.filter(p => p.material === 'glass');
        else if (cat === 'new') filtered = filtered.filter(p => p.badge === 'new');
      }

      // Manual filters
      if (document.getElementById('f-cotton').checked) filtered = filtered.filter(p => p.material === 'cotton');
      if (document.getElementById('f-silk').checked) filtered = filtered.filter(p => p.material === 'silk');
      if (document.getElementById('f-glass').checked) filtered = filtered.filter(p => p.material === 'glass');
      if (document.getElementById('f-new').checked) filtered = filtered.filter(p => p.badge === 'new');
      if (document.getElementById('f-gift').checked) filtered = filtered.filter(p => p.category === 'gift');

      const sort = document.getElementById('sortSelect').value;
      if (sort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
      else if (sort === 'price-desc') filtered.sort((a,b) => b.price - a.price);

      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      filtered.forEach(p => grid.appendChild(createProductCard(p)));
      document.getElementById('productCount').textContent = filtered.length;
    }
  </script>
</body>
</html>
