<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | niji-goods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .filter-bar { margin-top: 100px; padding: 40px 0; border-bottom: 1px solid #f0f0f0; }
    .filter-tags { display: flex; gap: 30px; justify-content: center; }
    .filter-tag { font-size: 13px; color: #999; cursor: pointer; transition: color 0.3s; position: relative; }
    .filter-tag:hover, .filter-tag.active { color: #1a1a1a; }
    .filter-tag.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 1px; background: #1a1a1a; }
  </style>
</head>
<body>

  <nav class="navbar-life">
    <a href="index.html" class="logo-life">niji-goods</a>
    <div class="nav-links-life">
      <a href="socks.html" class="active">Socks</a>
      <a href="about.html">Concept</a>
      <div class="lang-switcher">
        <span onclick="setLang('tc')" class="lang-btn" data-lang="tc">TC</span> / <span onclick="setLang('jp')" class="lang-btn" data-lang="jp">JP</span>
      </div>
    </div>
  </nav>

  <section class="filter-bar">
    <div class="container">
      <div class="filter-tags">
        <div class="filter-tag active" data-filter="all" data-tc="全部商品" data-jp="すべて">すべて</div>
        <div class="filter-tag" data-filter="cotton" data-tc="精梳棉" data-jp="コットン">コットン</div>
        <div class="filter-tag" data-filter="silk" data-tc="蠶絲" data-jp="シルク">シルク</div>
        <div class="filter-tag" data-filter="glass" data-tc="網紗" data-jp="シアー">シアー</div>
      </div>
    </div>
  </section>

  <section class="portal-section" style="background:#fff;">
    <div class="container">
      <div id="productGrid" class="division-grid" style="grid-template-columns: repeat(4, 1fr); gap: 40px 20px;">
        <!-- Filled by JS -->
      </div>
    </div>
  </section>

  <footer>
    <div class="logo-life" style="margin-bottom: 30px;">niji-goods</div>
    <p style="font-size: 0.7rem; color: #ccc;">&copy; 2026 niji-goods. All rights reserved.</p>
  </footer>

  <script src="store.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let activeFilter = urlParams.get('cat') || 'all';

    function applyFilter() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      
      const filtered = activeFilter === 'all' 
        ? PRODUCTS 
        : PRODUCTS.filter(p => p.material === activeFilter);
      
      filtered.forEach(p => {
        grid.appendChild(createProductCard(p));
      });

      document.querySelectorAll('.filter-tag').forEach(tag => {
        tag.classList.toggle('active', tag.getAttribute('data-filter') === activeFilter);
      });
    }

    document.querySelectorAll('.filter-tag').forEach(tag => {
      tag.addEventListener('click', () => {
        activeFilter = tag.getAttribute('data-filter');
        history.pushState(null, '', `?cat=${activeFilter}`);
        applyFilter();
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      setLang(currentLang);
      applyFilter();
    });
  </script>
</body>
</html>
